{n:'Mundo das Árvores',sky:['#bfe8ff','#fff1d6'],g:'#6bbf59',d:'#8a5a3b',b:'#ff9ec7',s:'#9b6bd1',h:'#ff9f5a',lv:4,gw:3,gp:.3},
{n:'Mundo do Deserto',sky:['#ffd98a','#fff0cf'],g:'#f5dc9a',d:'#d9b36a',b:'#e6a05f',s:'#d4915a',h:'#8c5a33',lv:4,gw:3,gp:.32},
{n:'Mundo do Pântano',sky:['#b7d9b0','#e6efc9'],g:'#5c8a4a',d:'#4a3b2a',b:'#6fb59a',s:'#5c9ea0',h:'#9acd32',lv:4,gw:3,gp:.32,aq:[1,2]},
{n:'Mundo dos Céus',sky:['#7fc8ff','#e9f6ff'],g:'#ffffff',d:'#dbeaff',b:'#ffd6e8',s:'#ff8fb8',h:'#ffe066',lv:4,gw:4,gp:.42},

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(w,i){const D=WD[w],R=rng(w*97+i*13+5),r=(a,b)=>a+Math.floor(R()*(b-a+1));
 const last=w==4&&i==3,aq=!!(D.aq&&D.aq.includes(i)),mini=!aq&&!last&&i==D.lv-1,bo=last||mini,len=(aq?100:88)+w*6+i*10+(bo?14:0);
 const o={...D,w,i,len,aq,n:D.n+' ('+(w+1)+'-'+(i+1)+')',gaps:[],pl:[],co:[],en:[],fish:[],pil:[],it:[],gm:[],e2:[],q:null,last,bn:BN[w]};
 if(aq){o.sky=['#2a7fa8','#0e3b5e'];for(let c=10;c<len-10;c+=r(5,7)){const up=R()<.5;o.pil.push([c,up]);o.co.push([c-1,up?8:4,3]);o.fish.push([c+3,r(4,9)]);if(R()<.6)o.gm.push([c,up?10:2]);if(R()<.2)o.it.push([c+4,up?9:3,'h']);if(i>=1&&!o.q&&c>len*.45)o.q=[c+3,6,i==1?'m':'y']}return o}
 const end=len-(bo?28:12);let c=9;
 while(c<end){const t=R();
  if(t<D.gp){const g=r(2,D.gw);o.gaps.push([c,g]);o.co.push([c,9,g]);c+=g+r(4,6)}
  else if(t<.65){const pw=r(3,4),pr=R()<.5?9:8;o.pl.push([c,pr,pw]);o.co.push([c,pr-1,pw]);if(R()<.4){o.pl.push([c+pw+1,6,3]);o.co.push([c+pw+1,5,3]);if(R()<.4)o.it.push([c+pw+2,5,'hsw'[r(0,2)]]);else if(R()<.6){o.pl.push([c+pw+4,4,2]);o.gm.push([c+pw+4,3],[c+pw+5,3])}}if(R()<.3+i*.1)o.en.push(c+1);c+=pw+r(5,7)}
  else{o.co.push([c,11,r(2,4)]);if(c>12&&R()<.8)o.en.push(c+r(1,3));if(i>=1&&R()<.35)o.e2.push([c+r(1,3),4]);if(i>=2&&R()<.3)o.e2.push([c+r(2,4),5]);if(i>=1&&!o.q&&c>len*.4)o.q=[c+2,8,i==1?'m':i==2?'y':R()<.5?'m':'y'];c+=r(5,7)}}
 if(bo){o.pl.push([len-18,9,3],[len-8,9,3]);o.boss=len-14;o.bh=BH[w]}
 return o}

const BD=[[56,48],[72,44],[60,58],[78,52],[70,68]];
function mk(px,t){if(t==1)return{x:px,y:GR*T-26,w:30,h:26,vx:-.8,vy:0,hp:1,t,dead:0,hi:0};
 if(t==4)return{x:px,x0:px,y:8*T,by:8*T,w:30,h:24,vx:.7,vy:0,hp:1,t,dead:0,hi:0,ph:px};
 if(t==5)return{x:px,y:GR*T-28,w:30,h:28,vx:-.5,vy:0,hp:2,t,dead:0,hi:0};
 const[bw,bh]=BD[L.w];return{x:px,y:GR*T-bh,w:bw,h:bh,vx:-1,vy:0,hp:5,t,dead:0,hi:0,hopT:0}}
function load(i){L=LV[i];G=Array.from({length:L.len},()=>Array(ROWS).fill(0));
 for(let c=0;c<L.len;c++){if(!L.gaps.some(g=>c>=g[0]&&c<g[0]+g[1])){G[c][GR]=1;G[c][GR+1]=1}}

 p={x:T*2,y:(L.aq?6*T:GR*T-30),w:22,h:30,vx:0,vy:0,f:1,ground:false,inv:0,coy:0,jb:0,hit:0,star:0,wing:0,dj:0,magic:0,cd:0,mount:0,fl:0,tg:0,cdT:0};
 cp={x:p.x,y:p.y};cam=0;startCoins=total;msg=tr('w')[L.w]+' ('+(L.w+1)+'-'+(L.i+1)+')'+(L.aq?tr('hold'):'');msgT=150;if(L.i==0)say(tr('wl')[L.w],p,220)}
function sol(tx,ty){if(ty>=ROWS)return 0;if(tx<0||tx>=L.len)return 1;if(ty<0)return 0;return G[tx][ty]}
function mvx(o,dx){o.hit=0;o.x+=dx;const a=Math.floor(o.y/T),b=Math.floor((o.y+o.h-1)/T);
 if(dx>0){const t=Math.floor((o.x+o.w)/T);for(let r=a;r<=b;r++)if(sol(t,r)){o.x=t*T-o.w;o.hit=1;return}}
 else if(dx<0){const t=Math.floor(o.x/T);for(let r=a;r<=b;r++)if(sol(t,r)){o.x=(t+1)*T;o.hit=1;return}}}
function mvy(o,dy){o.ground=false;o.y+=dy;const a=Math.floor(o.x/T),b=Math.floor((o.x+o.w-1)/T);

 else if(dy<0){const t=Math.floor(o.y/T);for(let c=a;c<=b;c++)if(sol(c,t)){if(o===p&&G[c]&&G[c][t]==4)hitQ(c,t);o.y=(t+1)*T;o.vy=0;return}}}
function hitQ(c,r){G[c][r]=5;it.push({x:c*T+16,y:(r-1)*T+16,t:L.q[2],got:0});snd(520,.1);setTimeout(()=>snd(780,.12),70)}

function hitE(e){if(e.dead||e.hi)return;e.hp--;e.hi=e.t==2?40:12;snd(500,.08,'square',.05);if(e.hp<=0){e.dead=1;total+=3;if(e.t==2){say(tr('bv'),p,160);it.push({x:e.x+e.w/2,y:e.y-10,t:'h',got:0})}}else if(e.t==2){e.vx=Math.sign(e.vx)*(1+(e.mhp-e.hp)*.4);say(tr('bh'),e,90)}}
function stepBullets(){bl.forEach(b=>{b.n--;mvx(b,b.vx);if(b.hit)b.n=0;if(!b.p){b.vy+=.35;mvy(b,b.vy);if(b.ground)b.vy=-5}
 en.forEach(e=>{if(b.n>0&&!e.dead&&b.x<e.x+e.w&&b.x+b.w>e.x&&b.y<e.y+e.h&&b.y+b.h>e.y){hitE(e);if(!b.p)b.n=0}})});bl=bl.filter(b=>b.n>0&&b.y<H+40)}
function stepFm(){if(!fm)return;fm.t++;fm.n--;fm.vy=Math.min(fm.vy+.5,10);mvx(fm,fm.vx);mvy(fm,fm.vy);if(fm.hit)fm.vx*=-1;
 if(fm.y>H+60||fm.n<=0){fm=null;return}
 if(!p.mount&&fm.t>25&&p.x<fm.x+fm.w&&p.x+p.w>fm.x&&p.y<fm.y+fm.h&&p.y+p.h>fm.y){fm=null;p.mount=1;p.h=40;p.y-=10;p.fl=40;snd(900,.1);say(tr('i6'),p)}}
function tongue(){if(p.cdT>0)p.cdT--;if(keys.tongue&&p.mount&&!p.tg&&p.cdT<=0){p.tg=14;p.cdT=26;snd(260,.1,'sawtooth',.05)}
 if(p.tg>0){p.tg--;if(!p.mount){p.tg=0;return}const len=70*Math.sin(Math.PI*(14-p.tg)/14),t0=p.f>0?p.x+31:p.x-9-len,ty=p.y+p.h-23;
  en.forEach(e=>{if(!e.dead&&e.t!=2&&t0<e.x+e.w&&t0+len+6>e.x&&ty<e.y+e.h&&ty+10>e.y){e.dead=30;ate++;total+=2;snd(180,.15,'triangle',.07);say(tr('yum'),p,60);if(ate%3==0&&hearts<6){hearts++;snd(1200,.2,'triangle')}}})}}
function setOver(){state='over';[392,330,262].forEach((f,i)=>setTimeout(()=>snd(f,.3,'triangle'),i*220))}
function arp(){[784,988,1175,1568].forEach((f,i)=>setTimeout(()=>snd(f,.12,'triangle',.05),i*70))}

function hurt(e){if(p.mount){p.mount=0;p.h=30;p.y+=10;p.inv=70;p.vy=-6;p.vx=(p.x<e.x?-1:1)*3;snd(220,.2,'sawtooth');say(tr('i7'),p,110);fm={x:p.x-6,y:p.y+2,w:34,h:28,vx:(p.x<e.x?-1:1)*3,vy:-5,t:0,n:700};return}hearts--;say(tr('hurt')[tick%3],p,70);p.inv=DF.i[dif];p.vy=-7;p.vx=(p.x<e.x?-1:1)*4;snd(180,.25,'sawtooth');if(hearts<=0)setOver()}
function upd(){tick++;
 const inp=keys.right-keys.left;
 const A=L.aq,GV=A?.14:L.low?.32:.55;
 if(A){p.vx+=inp*.35;if(!inp)p.vx*=.9;p.vx=Math.max(-2.6,Math.min(2.6,p.vx));if(inp)p.f=inp;if(jp){p.vy=-3;jp=0}if(keys.jump)p.vy-=.45;p.vy=Math.max(-3,Math.min(p.vy+GV,2.2))}
 else{
 p.vx+=inp*.55;if(!inp)p.vx*=.78;p.vx=Math.max(-3.4,Math.min(3.4,p.vx));if(inp)p.f=inp;

 else if(p.jb>0&&p.wing>0&&!p.dj){p.vy=L.low?-10.4:-12.6;p.jb=0;p.dj=1;snd(700,.08);setTimeout(()=>snd(1000,.1),50)}

 co.forEach(c=>{if(!c.got&&Math.hypot(c.x-(p.x+11),c.y-(p.y+15))<24){c.got=1;total++;snd(988,.06);setTimeout(()=>snd(1319,.12),60);if(total%25==0&&hearts<5){hearts++;snd(1200,.3,'triangle')}}});

const TX={
