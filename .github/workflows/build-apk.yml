name: Build Android APK (Web-to-App)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Project & Build APK
        run: |
          mkdir build_output
          cp -r * build_output/ || true
          
          # Criar projeto Android via Bubblewrap
          npx @bubblewrap/cli init --manifest=https://raw.githubusercontent.com/${{ github.repository }}/main/manifest.json || true
          
          # Compilar APK usando Cordova/Bubblewrap fallback
          npx cordova create android_app com.cati.emfuga "Princesa Cati em Fuga"
          cd android_app
          cp -r ../build_output/* www/
          npx cordova platform add android
          npx cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: princesa-cati-em-fuga-apk
          path: android_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
