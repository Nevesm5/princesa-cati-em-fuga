name: Gerar APK e publicar Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Definir a versão
        run: echo "VERSION=1.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o projeto Android (Capacitor)
        run: |
          mkdir -p www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='www' \
            --exclude='node_modules' --exclude='android' --exclude='icone' \
            --exclude='icon-only.png' \
            ./ www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Princesa Cati em Fuga" com.nevesco.cati --web-dir=www
          npx cap add android
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle

      - name: Gerar os ícones
        run: |
          if [ ! -f icon-only.png ]; then
            echo "ERRO: icon-only.png não está na raiz do repositório"
            ls -la
            exit 1
          fi
          npm install jimp@0.22
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const Jimp = require('jimp');
          const res = 'android/app/src/main/res';
          const sizes = [
            ['mdpi', 48, 108],
            ['hdpi', 72, 162],
            ['xhdpi', 96, 216],
            ['xxhdpi', 144, 324],
            ['xxxhdpi', 192, 432],
          ];
          (async () => {
            const img = await Jimp.read('icon-only.png');
            for (const [d, l, f] of sizes) {
              const dir = path.join(res, `mipmap-${d}`);
              fs.mkdirSync(dir, { recursive: true });
              const icon = img.clone().resize(l, l, Jimp.RESIZE_BICUBIC);
              await icon.writeAsync(path.join(dir, 'ic_launcher.png'));
              await icon.clone().writeAsync(path.join(dir, 'ic_launcher_round.png'));
              const fgSize = Math.floor(f * 0.72);
              const fg = img.clone().resize(fgSize, fgSize, Jimp.RESIZE_BICUBIC);
              const canvas = new Jimp(f, f, 0x00000000);
              canvas.composite(fg, Math.round((f - fgSize) / 2), Math.round((f - fgSize) / 2));
              await canvas.writeAsync(path.join(dir, 'cati_icon_fg.png'));
            }
          })().catch((e) => {
            console.error(e);
            process.exit(1);
          });
          EOF
          RES=android/app/src/main/res
          BG='#86ddf8'
          mkdir -p $RES/values $RES/mipmap-anydpi-v26
          echo "<resources><color name=\"cati_icon_bg\">$BG</color></resources>" > $RES/values/cati_icon_colors.xml
          for n in ic_launcher ic_launcher_round; do
            echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/cati_icon_bg"/><foreground android:drawable="@mipmap/cati_icon_fg"/></adaptive-icon>' > $RES/mipmap-anydpi-v26/$n.xml
          done
          echo "Ícones gerados:"
          find $RES -name 'cati_icon_fg.png' -o -name 'ic_launcher*.png' -o -name 'ic_launcher*.xml' | sort

      - name: Compilar o APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PrincesaCati-v$VERSION.apk

      - name: Publicar nova Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Versão ${{ env.VERSION }}
          files: PrincesaCati-v${{ env.VERSION }}.apk
