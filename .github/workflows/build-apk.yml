name: Gerar APK e publicar Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Montar o projeto Android (Capacitor)
        run: |
          mkdir -p www
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='www' \
            --exclude='node_modules' --exclude='android' \
            ./ www/
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Princesa Cati em Fuga" com.nevesco.cati --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Compilar o APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Renomear o APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PrincesaCati.apk

      - name: Publicar nova Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Versão ${{ github.run_number }}
          files: PrincesaCati.apk
