name: Build Android APK Auto

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova and Cordova-Res
        run: |
          npm install -g cordova cordova-res

      - name: Create Cordova Project & Configure Icon
        run: |
          # Criar o projeto Cordova
          npx cordova create android_app com.cati.emfuga "Princesa Cati em Fuga"
          
          # Copiar o jogo web para a pasta do app
          mkdir -p build_output
          cp -r * build_output/ || true
          cp -r build_output/* android_app/www/
          
          cd android_app
          
          # Se existir icon.png na raiz, configura como ícone do app
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
            # Adiciona a tag de ícone no config.xml
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          fi
          
          # Adiciona plataforma Android e compila
          npx cordova platform add android
          npx cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: princesa-cati-em-fuga-apk
          path: android_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
