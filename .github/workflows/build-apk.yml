name: Build and Release APKs

on:
  push:
    branches:
      - main # ou 'master'

jobs:
  build-and-release:
    name: Build & Publish APKs
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o histórico completo de tags
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Calcula a próxima versão (v1.0 -> v1.1 -> v1.2)
      - name: Calculate Next Version
        id: versioning
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v1.0"
          else
            VERSION_WITHOUT_V="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION_WITHOUT_V" | cut -d. -f1)
            MINOR=$(echo "$VERSION_WITHOUT_V" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="v${MAJOR}.${NEW_MINOR}"
          fi

          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Próxima versão: $NEW_VERSION"

      # 3. Configura o JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Torna o gradlew executável na raiz
      - name: Make Gradle executable
        run: chmod +x gradlew

      # 5. Compila os APKs na raiz
      - name: Build Android Release APK
        run: ./gradlew assembleRelease

      # 6. Cria a Release e faz upload dos APKs gerados
      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.VERSION }}
          name: Release ${{ steps.versioning.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
