name: Build and Release APKs

on:
  push:
    branches:
      - main # ou 'master'

jobs:
  build-and-release:
    name: Build & Publish APKs
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o repositório completo
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Calcula a versão (v1.0, v1.1...)
      - name: Calculate Next Version
        id: versioning
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v1.0"
          else
            VERSION_WITHOUT_V="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION_WITHOUT_V" | cut -d. -f1)
            MINOR=$(echo "$VERSION_WITHOUT_V" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="v${MAJOR}.${NEW_MINOR}"
          fi

          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Próxima versão: $NEW_VERSION"

      # 3. Configura o JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Localiza o gradlew e concede permissão de execução
      - name: Make Gradle executable
        run: |
          GRADLEW_PATH=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERRO: O ficheiro gradlew não foi encontrado no repositório."
            exit 1
          fi
          echo "gradlew encontrado em: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          echo "GRADLEW_DIR=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV

      # 5. Compila o APK de Release no diretório correto
      - name: Build Android Release APK
        run: |
          cd ${{ env.GRADLEW_DIR }}
          ./gradlew assembleRelease

      # 6. Publica a Release no GitHub
      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.VERSION }}
          name: Release ${{ steps.versioning.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            **/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
